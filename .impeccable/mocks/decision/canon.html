<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:560px;height:820px;overflow:hidden;font:13px/1.4 "Segoe UI",sans-serif;color:#ddd;background:#1e1e1e;position:relative}
.top{display:flex;gap:12px;padding:12px;border-bottom:1px solid #333}
.plot{width:110px;height:110px;background:#111;border-radius:4px;position:relative}
.plot .ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:4px solid #3c8dde}
.plot .dot{position:absolute;left:50%;top:calc(50% - 18px);width:8px;height:8px;margin:-4px;background:#fff;border-radius:50%}
h1{font-size:15px;font-weight:600}.ok{color:#3c8dde;font-weight:600}
.sh{padding:6px 12px;background:#2d2d30;border-bottom:1px solid #3a3a3a;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 12px 5px 24px}
.in{background:#333;border:1px solid #444;color:#ddd;padding:2px 6px;border-radius:3px;width:150px}
.btn{background:#0e639c;color:#fff;padding:3px 12px;border-radius:3px}
.foot{position:absolute;bottom:0;left:0;right:0;padding:8px 12px;border-top:1px solid #333;display:flex;justify-content:flex-end}
</style></head><body>
<div class="top"><div class="plot"><div class="ring"></div><div class="dot"></div></div><div><h1>Gens Input Display</h1><div>Source: game value</div><div class="ok">M-speed: ON</div></div></div>
<div class="sh">▼ Display</div>
<div class="row"><span>Shape</span><span class="in">Octagon ▾</span></div>
<div class="row"><span>Ring color</span><span class="in">#FFFFFF</span></div>
<div class="row"><span>Dot size</span><span class="in">4</span></div>
<div class="row"><span>Button set</span><span class="in">Xbox ▾</span></div>
<div class="row"><span>Toon</span><span class="in">Sonic ▾</span></div>
<div class="row"><span>Layout</span><span class="in">Diamond ▾</span></div>
<div class="row"><span>Edit layout on overlay</span><span class="btn">Edit</span></div>
<div class="row"><span>See-through window</span><span>☑</span></div>
<div class="sh">▶ Input</div><div class="sh">▶ M-speed</div><div class="sh">▶ Research</div>
<div class="foot"><span class="btn">Save settings</span></div>
</body></html>
